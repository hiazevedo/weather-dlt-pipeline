bundle:
  name: weather-dlt-pipeline-birigui

workspace:
  host: https://dbc-4755d9a9-d11b.cloud.databricks.com
  root_path: ~/.bundle/${bundle.name}/${bundle.target}

targets:

  dev:
    # Sem mode: development — esse modo pausa todos os schedules a cada deploy
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Shared/weather-dlt-pipeline-birigui

# ---------------------------------------------------------------------------
resources:
  jobs:

    # -------------------------------------------------------------------------
    # Job principal: coleta previsão → DLT → gold → features → previsões (a cada hora)
    # -------------------------------------------------------------------------
    weather_pipeline:
      name: "[weather] Pipeline Completo (1h)"
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      # Uma execução leva ~6 min; passar de 30 min indica algo travado
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        on_duration_warning_threshold_exceeded:
          - ${workspace.current_user.userName}

      tasks:
        - task_key: coleta_previsao
          max_retries: 2
          min_retry_interval_millis: 60000
          description: "Coleta previsão atualizada da Open-Meteo e salva JSON no Volume"
          notebook_task:
            notebook_path: ${workspace.file_path}/04_collect_forecast
            source: WORKSPACE

        - task_key: dlt_pipeline
          max_retries: 2
          min_retry_interval_millis: 60000
          description: "Executa o pipeline DLT Bronze→Silver→Gold"
          depends_on:
            - task_key: coleta_previsao
          pipeline_task:
            pipeline_id: bdae0918-2a68-42a8-8688-3f1f936d4946
            full_refresh: false

        - task_key: gold_today
          max_retries: 2
          min_retry_interval_millis: 60000
          description: "Gera weather_today e rain_alert para o dashboard"
          depends_on:
            - task_key: dlt_pipeline
          notebook_task:
            notebook_path: ${workspace.file_path}/05_gold_today
            source: WORKSPACE

        - task_key: update_features
          max_retries: 2
          min_retry_interval_millis: 60000
          description: "Atualiza feature store com dados do dia para o modelo ML"
          depends_on:
            - task_key: gold_today
          notebook_task:
            notebook_path: /Workspace/Users/higor_com@hotmail.com/.bundle/weather-ml-rain-forecast/dev/files/07_update_features
            source: WORKSPACE

        - task_key: ml_inference
          max_retries: 2
          min_retry_interval_millis: 60000
          description: "Executa predições do modelo de chuva e salva rain_forecast_ml"
          depends_on:
            - task_key: update_features
          notebook_task:
            notebook_path: /Workspace/Users/higor_com@hotmail.com/.bundle/weather-ml-rain-forecast/dev/files/05_batch_inference
            source: WORKSPACE

    # -------------------------------------------------------------------------
    # Job semanal: ENSO e previsões arquivadas (independentes) +
    #              backfill com o Archive (ERA5) → DLT → reconstrução das features
    # Fecha buracos deixados por falhas e troca as horas recentes pelos dados
    # do Archive (mesma fonte do treino). Domingo 04h30, no meio da hora: o job de 1h
    # roda na hora cheia e dispara o mesmo pipeline DLT e grava a mesma gold.rain_features.
    # -------------------------------------------------------------------------
    backfill_archive:
      name: "[weather] Semanal — Archive ERA5, ENSO e previsões arquivadas"
      schedule:
        quartz_cron_expression: "0 30 4 ? * SUN"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      tasks:
        # Índice ENSO (ONI/NOAA): global, atualizado mensalmente — independe das demais tasks
        - task_key: collect_enso
          max_retries: 2
          min_retry_interval_millis: 300000
          description: "Atualiza weather_pipeline.silver.enso_oni (NOAA CPC)"
          notebook_task:
            notebook_path: ${workspace.file_path}/07_collect_enso
            source: WORKSPACE

        # Previsões arquivadas (Previous Runs API): acumula a base para o MOS
        - task_key: collect_previous_runs
          max_retries: 2
          min_retry_interval_millis: 300000
          description: "Atualiza weather_pipeline.silver.forecast_previous_runs"
          notebook_task:
            notebook_path: ${workspace.file_path}/09_collect_previous_runs
            source: WORKSPACE

        # INMET: lê os CSVs que o script local scripts/inmet_sync.py envia ao Volume
        # (o INMET bloqueia o Databricks); sem arquivos novos, só reprocessa
        - task_key: ingest_inmet
          max_retries: 1
          description: "Atualiza weather_pipeline.silver.inmet_hourly a partir do Volume bronze.inmet"
          notebook_task:
            notebook_path: ${workspace.file_path}/10_ingest_inmet
            source: WORKSPACE

        # Avisos do INMET: o coletor do celular já dispara a ingestão quando um aviso
        # muda; esta task é só um reforço semanal
        - task_key: ingest_avisos
          max_retries: 1
          notebook_task:
            notebook_path: ${workspace.file_path}/11_ingest_avisos
            source: WORKSPACE

        # Champion × chuva medida nas cidades das estações do INMET (dashboard)
        - task_key: validate_inmet
          max_retries: 1
          description: "Atualiza gold.era5_vs_inmet e a validação do champion contra o INMET"
          depends_on:
            - task_key: ingest_inmet
          notebook_task:
            notebook_path: /Workspace/Users/higor_com@hotmail.com/.bundle/weather-ml-rain-forecast/dev/files/11_experiment_inmet_validacao
            source: WORKSPACE

        - task_key: backfill_archive
          max_retries: 2
          min_retry_interval_millis: 300000
          description: "Regrava historical_<ano>.json até hoje − 5 dias"
          notebook_task:
            notebook_path: ${workspace.file_path}/06_backfill_archive
            source: WORKSPACE

        - task_key: dlt_pipeline
          max_retries: 2
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: backfill_archive
          pipeline_task:
            pipeline_id: bdae0918-2a68-42a8-8688-3f1f936d4946
            full_refresh: false

        - task_key: rebuild_features
          max_retries: 2
          min_retry_interval_millis: 60000
          description: "Reconstrói gold.rain_features a partir da silver atualizada"
          depends_on:
            - task_key: dlt_pipeline
          notebook_task:
            notebook_path: /Workspace/Users/higor_com@hotmail.com/.bundle/weather-ml-rain-forecast/dev/files/01_feature_engineering
            source: WORKSPACE

        # ANA: postos pluviométricos (leitura diária) e estações telemétricas perto da
        # cidade, pelo web service público da ANA (responde do Databricks)
        - task_key: collect_ana
          max_retries: 2
          min_retry_interval_millis: 300000
          description: "Atualiza silver.ana_estacoes, ana_diaria, ana_chuva_horaria e a view gold.ana_telemetria_qc"
          notebook_task:
            notebook_path: ${workspace.file_path}/13_collect_ana
            source: WORKSPACE

        # ENSO × clima de Birigui: estudo do impacto, previsibilidade, estação chuvosa
        # (início provisório da estação em curso) e a view de acompanhamento da estação
        - task_key: enso_impacto
          max_retries: 1
          description: "Atualiza gold.enso_impacto, enso_previsibilidade, estacao_chuvosa e a view estacao_vs_analogos"
          depends_on:
            - task_key: collect_enso
            - task_key: collect_ana
            - task_key: ingest_inmet
            - task_key: dlt_pipeline
          notebook_task:
            notebook_path: ${workspace.file_path}/12_enso_impacto
            source: WORKSPACE

    # -------------------------------------------------------------------------
    # Job avulso: coleta histórica (executar manualmente uma única vez)
    # -------------------------------------------------------------------------
    collect_history:
      name: "[weather] Coleta Histórica (manual)"
      tasks:
        - task_key: collect_history
          description: "Coleta 86 anos de dados históricos da Open-Meteo Archive API"
          notebook_task:
            notebook_path: ${workspace.file_path}/01_collect_history
            source: WORKSPACE

    # -------------------------------------------------------------------------
    # Vigia: falha (→ e-mail) quando o job de 1h, a coleta da previsão, o
    # celular (sinal de vida) ou o backfill semanal param. Cada problema
    # alerta uma vez e repete a cada 12 h enquanto durar (gold.vigia_alertas).
    # Não cobre o caso de o Databricks bloquear todas as execuções.
    # -------------------------------------------------------------------------
    vigia:
      name: "[weather] Vigia (a cada 3 h)"
      schedule:
        quartz_cron_expression: "0 40 */3 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      tasks:
        - task_key: vigia
          # 0 é omitido no deploy e o serverless repete a task; o 14_vigia trata isso
          max_retries: 0
          description: "Confere se as coletas e o pipeline continuam vivos"
          notebook_task:
            notebook_path: ${workspace.file_path}/14_vigia
            source: WORKSPACE
